<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16261a">
<title>Rojin · World Fast Food Day</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0f1a11;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(120% 90% at 50% 40%,#345a36 0%,#16261a 55%,#0b130d 100%);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    -webkit-font-smoothing:antialiased}

  /* ---------- viewport: always the *visible* area (dvh = follows mobile browser bars) ---------- */
  #view{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow:hidden;touch-action:none}
  /* soft blurred copy of the poster that fills the empty bands around it (drawn tiny, scaled up = free blur) */
  #backdrop{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .8s ease}
  #backdrop.on{opacity:1}
  #shade{position:absolute;inset:0;background:rgba(5,11,7,.4);pointer-events:none}

  /* ---------- stage (poster coordinate system: 1080 x 1441), positioned + scaled by fit() ---------- */
  #stage{position:absolute;left:0;top:0;width:1080px;height:1441px;transform-origin:0 0;
    overflow:hidden;contain:layout paint;background:#b9ddb0;cursor:pointer;
    --mx:0;--my:0}
  @media (min-width:700px){
    #stage{box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
  }
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* the glow only needs the area it actually lights (was a full-poster layer) */
  #glow{position:absolute;left:240px;top:590px;width:730px;height:720px;pointer-events:none;
    background:radial-gradient(497px 490px at 365px 361px,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
    animation:glow 5.5s ease-in-out infinite alternate}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* parallax is written straight onto each sprite by JS (no inherited CSS variable = no per-frame style recalc of the whole tree) */
  .spr{position:absolute;pointer-events:none;transform:translate3d(0,0,0)}
  .spr>.in,.spr .idle,.spr .sq{width:100%;height:100%;transform-origin:var(--o,50% 50%)}
  .spr img{display:block;width:100%;height:100%;-webkit-user-drag:none}
  .spr img.ext{position:absolute;opacity:0}
  .go .spr img.ext{animation:fadeIn .35s linear 2s both}
  #cover{position:absolute;display:block;pointer-events:none}
  .go #cover{animation:fadeOut .7s ease-out 1.45s both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  .big{will-change:transform}

  /* ---------- hidden until everything is decoded ---------- */
  #stage:not(.go) .in,#stage:not(.go) .steam{opacity:0}

  /* ---------- easing ----------
     Springs are real physical curves (CSS linear()), so one smooth overshoot-and-settle
     replaces the old multi-keyframe stop-and-go. Older browsers get a bezier fallback. */
  :root{--spr-fly:cubic-bezier(.2,.85,.25,1.1);--spr-pop:cubic-bezier(.2,.9,.3,1.14)}
  @supports (animation-timing-function:linear(0,1)){
    :root{
      --spr-fly:linear(0, 0.0287, 0.1028, 0.2059, 0.3247, 0.4483, 0.5688, 0.6804, 0.7795, 0.8639, 0.933, 0.9872, 1.0274, 1.0554, 1.0728, 1.0815, 1.0835, 1.0803, 1.0736, 1.0647, 1.0547, 1.0443, 1.0344, 1.0252, 1.0171, 1.0103, 1.0047, 1.0004, 0.9972, 0.9951, 0.9937, 0.9931, 0.993, 0.9934, 0.994, 0.9947, 0.9956, 0.9964, 0.9973, 0.998, 0.9987, 0.9992, 0.9997, 1, 1);
      --spr-pop:linear(0, 0.0352, 0.1254, 0.2498, 0.3909, 0.5348, 0.671, 0.7926, 0.8953, 0.9773, 1.0388, 1.0811, 1.1067, 1.1182, 1.1187, 1.1111, 1.0982, 1.0821, 1.0649, 1.048, 1.0324, 1.0189, 1.0077, 0.999, 0.9928, 0.9887, 0.9864, 0.9857, 0.9861, 0.9874, 0.9891, 0.9911, 0.9932, 0.9951, 0.9969, 0.9984, 0.9996, 1.0005, 1.0011, 1.0015, 1.0017, 1.0017, 1.0016, 1.0014, 1);
    }
  }

  /* ---------- entrance ---------- */
  .go .g-burger>.in {animation:burgerIn 1.3s linear .15s both}
  .go .g-bottle>.in {animation:bottleIn 1.1s linear .75s both,fadeIn .2s ease-out .75s both}
  .go .g-splashL>.in,.go .g-splashR>.in{animation:splashIn .95s var(--spr-pop) 1.42s both,fadeIn .15s ease-out 1.42s both}
  .go .g-drop>.in   {animation:flyIn .95s var(--spr-fly) calc(1.5s + var(--i)*28ms) both,fadeIn .2s ease-out calc(1.5s + var(--i)*28ms) both}
  .go .g-bit>.in    {animation:flyIn .9s var(--spr-fly) calc(1.6s + var(--i)*40ms) both,fadeIn .2s ease-out calc(1.6s + var(--i)*40ms) both}
  .go .g-float>.in,.go .g-zfloat>.in{animation:flyIn 1.05s var(--spr-fly) calc(.95s + var(--i)*55ms) both,fadeIn .25s ease-out calc(.95s + var(--i)*55ms) both}
  .go .g-title>.in  {animation:titleIn 1.15s cubic-bezier(.22,.8,.2,1) calc(1.75s + var(--i)*190ms) both}

  /* once the intro is over, drop the finished animations: fewer GPU layers to keep alive */
  .settled .in{animation:none!important}
  .settled .spr img.ext{animation:none;opacity:1}
  .settled #cover{display:none}

  /* ---------- idle loops ---------- */
  .g-burger .idle {animation:burgerIdle 3.8s ease-in-out infinite alternate}
  .g-bottle .idle {animation:bottleIdle 4.6s ease-in-out infinite alternate}
  .g-splashL .idle{animation:splashL 2.9s ease-in-out infinite alternate}
  .g-splashR .idle{animation:splashR 3.3s ease-in-out infinite alternate}
  .g-drop .idle,.g-bit .idle{animation:dropIdle var(--t,3s) ease-in-out var(--dl,0s) infinite alternate}
  .g-float .idle,.g-zfloat .idle{animation:floatIdle var(--t,5s) ease-in-out var(--dl,0s) infinite alternate}
  .g-title .idle  {animation:titleIdle 5s ease-in-out calc(var(--i)*-.9s) infinite alternate}
  .sq.squeeze{animation:squeeze .6s cubic-bezier(.3,.6,.3,1)}

  /* bottle light sweep. Only a thin slanted band moves (pure transform = compositor only);
     the bottle-shaped mask stays still. No blend mode, no background-position repaint. */
  .shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .shine::before{content:"";position:absolute;left:0;top:-5%;width:42%;height:110%;
    background:linear-gradient(90deg,rgba(255,235,220,0),rgba(255,238,226,.62) 50%,rgba(255,235,220,0));
    transform:translate3d(-240%,0,0) skewX(-20deg);
    animation:shine 5.2s ease-in-out 3.2s infinite}

  /* steam over the hot burger: plain soft gradient, no blur filter */
  .steam{position:absolute;width:130px;height:210px;pointer-events:none;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,255,255,.62),rgba(255,255,255,.3) 45%,rgba(255,255,255,0));
    opacity:0;animation:steam 4.6s ease-in infinite;animation-delay:var(--dl)}

  /* automatic quality step-down if the device can't hold its frame rate */
  .lite .steam,.lite .shine{display:none}

  @keyframes glow{from{opacity:.25}to{opacity:.8}}

  /* burger: gravity fall (ease-in) -> impact squash -> three shrinking bounces.
     Each leg has its own easing, so speed is continuous and turn-arounds are soft. */
  @keyframes burgerIn{
    0%  {transform:translate3d(0,-1180px,0) rotate(-9deg);animation-timing-function:cubic-bezier(.45,0,.85,.4)}
    50% {transform:translate3d(0,0,0) rotate(1.4deg) scale(1.045,.93);animation-timing-function:cubic-bezier(.12,.6,.3,1)}
    66% {transform:translate3d(0,-16px,0) rotate(-.7deg) scale(.992,1.014);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    82% {transform:translate3d(0,4px,0) rotate(.25deg) scale(1.004,.996);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    100%{transform:none}}
  /* bottle: swoops in (ease-out into the overshoot), then settles with soft sine turn-arounds */
  @keyframes bottleIn{
    0%  {transform:translate3d(560px,460px,0) rotate(42deg);animation-timing-function:cubic-bezier(.2,.75,.3,1)}
    60% {transform:translate3d(-12px,-16px,0) rotate(-4.5deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    80% {transform:translate3d(4px,5px,0) rotate(1.4deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    100%{transform:none}}
  @keyframes splashIn{from{transform:scale(0)}to{transform:none}}
  @keyframes flyIn{
    from{transform:translate3d(var(--fx),var(--fy),0) scale(0) rotate(var(--fr,0deg))}
    to  {transform:none}}
  @keyframes titleIn{
    0%{clip-path:inset(-25% 105% -25% -8%);transform:translate3d(-26px,0,0);opacity:0}
    25%{opacity:1}
    100%{clip-path:inset(-25% -8% -25% -8%);transform:none;opacity:1}}

  @keyframes burgerIdle{from{transform:translate3d(0,6px,0) rotate(-.5deg)}to{transform:translate3d(0,-8px,0) rotate(.55deg)}}
  @keyframes bottleIdle{from{transform:translate3d(0,3px,0) rotate(-.65deg)}to{transform:translate3d(0,-5px,0) rotate(.65deg)}}
  @keyframes splashL{from{transform:scale(1) rotate(0)}to{transform:scale(1.026,1.018) rotate(-.45deg)}}
  @keyframes splashR{from{transform:scale(1) rotate(0)}to{transform:scale(1.03,1.02) rotate(.5deg)}}
  @keyframes dropIdle{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--ax),var(--ay),0) scale(1.08)}}
  @keyframes floatIdle{from{transform:translate3d(0,0,0) rotate(calc(var(--r)*-1))}to{transform:translate3d(var(--ax),var(--ay),0) rotate(var(--r))}}
  @keyframes titleIdle{from{transform:translate3d(0,1.5px,0)}to{transform:translate3d(0,-2.5px,0)}}
  @keyframes squeeze{0%{transform:none}30%{transform:scale(.955,1.03)}60%{transform:scale(1.02,.985)}100%{transform:none}}
  @keyframes shine{
    0%{transform:translate3d(-240%,0,0) skewX(-20deg)}
    38%,100%{transform:translate3d(380%,0,0) skewX(-20deg)}}
  @keyframes steam{
    0%{transform:translate3d(0,50px,0) scale(.55);opacity:0}
    25%{opacity:.42}
    100%{transform:translate3d(var(--sx),-170px,0) scale(1.5);opacity:0}}

  /* ---------- small UI (respects phone notches / home bar) ---------- */
  #replay{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;font:22px/44px system-ui,sans-serif;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);transition:background .2s,transform .3s}
  #replay:hover{background:rgba(255,255,255,.28);transform:rotate(-90deg)}
  #replay:focus-visible{outline:2px solid #fff;outline-offset:3px}
  #hint{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);padding:8px 16px;border-radius:999px;direction:rtl;
    background:rgba(0,0,0,.45);color:#fff;font:13px/1.4 Tahoma,Vazirmatn,system-ui,sans-serif;white-space:nowrap;
    pointer-events:none;opacity:0;animation:hint 6s ease 3.2s both}
  @keyframes hint{0%{opacity:0;transform:translate(-50%,-10px)}12%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

  @media (prefers-reduced-motion:reduce){
    .idle,.steam,.shine::before,#glow{animation-duration:12s!important}
  }
</style>
</head>
